<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vehicle Entry</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <header>
        <h1>Modern Parking System</h1>
        <p>Vehicle Entry</p>
    </header>

    <main>

        <div class="form-container">

            <h2>Register Vehicle Entry</h2>

            <form method="POST">

                <div class="form-group">

                    <label for="plate_number">
                        Vehicle Registration Number
                    </label>

                    <input
                        type="text"
                        id="plate_number"
                        name="plate_number"
                        placeholder="e.g. KDA 123A"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="vehicle_type">
                        Vehicle Type
                    </label>

                    <select
                        id="vehicle_type"
                        name="vehicle_type"
                        required
                    >

                        <option value="">
                            -- Select Vehicle Type --
                        </option>

                        <option value="Car">
                            Car
                        </option>

                        <option value="Motorcycle">
                            Motorcycle
                        </option>

                        <option value="Van">
                            Van
                        </option>

                        <option value="Truck">
                            Truck
                        </option>

                    </select>

                </div>


                <button type="submit">
                    Register Vehicle
                </button>

            </form>

            <br>

            <a href="{{ url_for('dashboard') }}">
                ← Back to Dashboard
            </a>

        </div>

    </main>

</body>

</html>
